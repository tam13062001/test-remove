stages:
  - build
  - deploy

variables:
  NODE_ENV: production

before_script:
  - echo "Starting CI/CD Pipeline..."

build_job:
  stage: build
  image: node:22
  script:
    - echo "Installing dependencies..."
    - npm ci
    - echo "Building application..."
    - npm run build
  artifacts:
    paths:
      - theme/
    expire_in: 1 hour
  only:
    - main
    - dev

deploy_uat:
  stage: deploy
  variables:
    UPSTREAM_REF: $CI_MERGE_REQUEST_REF_PATH
  needs:
    - build_job   
  trigger:
    project: datumhq-consulting-vn/management/common-services/datumhq-websites/wordpress-application
    branch: main
    strategy: depend
  only:
    - main
    - dev
